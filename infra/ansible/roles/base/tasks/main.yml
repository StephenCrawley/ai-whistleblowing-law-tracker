- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    upgrade: full
- name: Unattended upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
- name: Copy over apt auto-upgrades file
  vars:
    auto_upgrades_content:  |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  ansible.builtin.copy:
    owner: root
    group: root
    mode: "0644"
    content: "{{ auto_upgrades_content }}"
    dest: /etc/apt/apt.conf.d/20auto-upgrades
- name: Set automatic reboot
  vars:
    unattended_upgrades_local:  |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  ansible.builtin.copy:
    owner: root
    group: root
    mode: "0644"
    content: "{{ unattended_upgrades_local }}"
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
- name: Install time sync client
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
- name: Enable and start time sync
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    state: present
- name: Create admin .ssh directory
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"
- name: Install admin SSH key (replaces any other keys)
  ansible.builtin.copy:
    src: admin.pub
    dest: "/home/{{ admin_user }}/.ssh/authorized_keys"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
- name: Allow admin passwordless sudo
  ansible.builtin.copy:
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ admin_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
